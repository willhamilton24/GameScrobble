services:
  - type: web
    name: gamescrobble-api
    runtime: go
    plan: free
    buildCommand: npm install && npm run build && go build -o server .
    startCommand: ./server
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STEAM_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PREMIUM_PRICE_ID
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: AFFILIATE_PARTNER_TAG
        sync: false
